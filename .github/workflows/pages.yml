name: Publish live demo

# A static copy of the dashboard on GitHub Pages (scripts/export_static.py). Needs Settings -> Pages ->
# Source: "GitHub Actions" once. Runs on every push to main and after each weekly data update.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Weekly data update"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/export_static.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
